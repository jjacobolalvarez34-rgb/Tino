<title>Formación y desempeño</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: el ciclo de formación de las asesoras, en las palabras de la dueña. Arriba lo que hay que hacer, luego cómo van, luego el calendario. */
:root{
  --marca:#74305F; --marca-fuerte:#5A2449; --marca-suave:#F3E4EE; --foco:#C99BBB;
  --fondo:#F7F5F7; --sup:#FFFFFF; --texto:#22161F; --suave:#5E5862; --borde:#E2DDE3; --div:#F0ECF0;
  --ok:#1C7638; --ok-f:#E1F2E5; --rev:#7A5A00; --rev-f:#FBF1CC; --apo:#9A2A0A; --apo-f:#FDE5DA;
  --info:#2557A7; --info-f:#E3ECFA;
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --marca:#D7A6C8; --marca-fuerte:#E8C3DC; --marca-suave:#3A2236; --foco:#8E5A7E;
  --fondo:#151017; --sup:#201823; --texto:#F3EEF4; --suave:#B8AEBD; --borde:#3A2F40; --div:#2A2130;
  --ok:#7BD08F; --ok-f:#17321F; --rev:#E8C766; --rev-f:#3A3012; --apo:#F29A7C; --apo-f:#3D1E14;
  --info:#8FB4F0; --info-f:#1B2840; color-scheme:dark}}
:root[data-theme="dark"]{
  --marca:#D7A6C8; --marca-fuerte:#E8C3DC; --marca-suave:#3A2236; --foco:#8E5A7E;
  --fondo:#151017; --sup:#201823; --texto:#F3EEF4; --suave:#B8AEBD; --borde:#3A2F40; --div:#2A2130;
  --ok:#7BD08F; --ok-f:#17321F; --rev:#E8C766; --rev-f:#3A3012; --apo:#F29A7C; --apo-f:#3D1E14;
  --info:#8FB4F0; --info-f:#1B2840; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--fondo);color:var(--texto);font-family:var(--f);font-size:16px;line-height:1.45}
.envoltura{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* Encabezado */
.cabeza{display:flex;align-items:center;gap:12px;padding-block:20px 8px;flex-wrap:wrap}
.logo{width:40px;height:40px;flex:none}
.cabeza h1{font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.01em}
.cabeza p{margin:0;color:var(--suave);font-size:15px}
.cabeza .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.ejemplo{background:var(--info-f);color:var(--info);border-radius:12px;padding:12px 16px;font-size:15px;margin-block:8px 16px;display:flex;gap:10px;align-items:flex-start}
.ejemplo b{font-weight:700}

/* Pestañas */
.pestanas{display:flex;gap:6px;background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:5px;width:fit-content;max-width:100%;overflow-x:auto}
.pestanas button{border:0;background:transparent;padding:10px 18px;border-radius:10px;font-weight:600;font-size:16px;color:var(--suave);white-space:nowrap;min-height:44px}
.pestanas button[aria-selected="true"]{background:var(--marca);color:#fff}
:root[data-theme="dark"] .pestanas button[aria-selected="true"]{color:#201823}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pestanas button[aria-selected="true"]{color:#201823}}
.barra{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-block:16px 8px}
.periodo{display:flex;gap:6px;align-items:center;color:var(--suave);font-size:15px}
.periodo select{border:1px solid var(--borde);background:var(--sup);border-radius:10px;padding:8px 10px;min-height:44px}

/* Secciones */
.seccion{margin-top:28px}
.seccion > h2{font-size:21px;font-weight:800;margin-bottom:4px}
.seccion > .sub{color:var(--suave);margin:0 0 14px;font-size:15px}
.rejilla{display:grid;gap:12px}
.dos{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* Pendientes */
.pend{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.caja{background:var(--sup);border:1px solid var(--borde);border-radius:16px;padding:16px;min-width:0}
.caja h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cuenta{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px}
.c-apo{background:var(--apo-f);color:var(--apo)} .c-rev{background:var(--rev-f);color:var(--rev)} .c-ok{background:var(--ok-f);color:var(--ok)} .c-info{background:var(--info-f);color:var(--info)}
.fila{display:flex;gap:10px;align-items:flex-start;padding-block:10px;border-top:1px solid var(--div)}
.fila:first-of-type{border-top:0}
.fila .t{font-weight:600}
.fila .d{color:var(--suave);font-size:14px}
.fila button.lnk{all:unset;cursor:pointer;color:var(--marca);font-weight:600}
.fila button.lnk:focus-visible{outline:3px solid var(--foco)}

/* Indicadores */
.ind{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.kpi{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .n{font-size:15px;color:var(--suave);font-weight:600}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.01em;margin-block:2px}
.kpi .exp{font-size:13px;color:var(--suave)}
.delta{font-size:14px;font-weight:700}
.sube{color:var(--ok)} .baja{color:var(--apo)} .igual{color:var(--suave)}

/* Ciclo */
.ciclo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.ciclo{grid-template-columns:1fr}}
.etapa{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:14px;position:relative;min-width:0}
.etapa .paso{font-size:13px;font-weight:700;color:var(--marca)}
.etapa h3{font-size:17px;font-weight:800;margin-block:2px 4px}
.etapa .q{font-size:13px;color:var(--suave);margin-bottom:8px}
.caritas{display:flex;flex-wrap:wrap;gap:4px}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:700;background:var(--marca-suave);color:var(--marca);flex:none;border:0}
button.av{cursor:pointer}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dia{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:12px;min-height:120px;min-width:0}
.dia .f{font-weight:800;font-size:15px}
.dia.hoy{border-color:var(--marca);box-shadow:0 0 0 1px var(--marca) inset}
.ev{margin-top:8px;background:var(--marca-suave);border-radius:10px;padding:8px 10px;font-size:14px}
.ev b{display:block;font-size:14px}
.ev span{color:var(--suave);font-size:13px}
.ev.inc{background:var(--rev-f)} .ev.coa{background:var(--ok-f)} .ev.eva{background:var(--info-f)}

/* Lista asesoras / tabla */
.tabla-cont{overflow-x:auto;background:var(--sup);border:1px solid var(--borde);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th{text-align:left;font-size:13px;color:var(--suave);font-weight:700;padding:12px 12px;border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--div);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--div)}
.nom{display:flex;align-items:center;gap:10px;font-weight:600}
.est{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;display:inline-block}

/* Chips punto / asesora */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--borde);background:var(--sup);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--marca-suave);border-color:var(--marca);color:var(--marca)}

/* Ficha */
.ficha-cab{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--sup);border:1px solid var(--borde);border-radius:16px;padding:16px}
.ficha-cab .av{width:56px;height:56px;font-size:20px}
.ficha-cab h2{font-size:24px;font-weight:800}
.ficha-cab .d{color:var(--suave)}
.bloque p{margin:6px 0 0}
.etq{font-size:13px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
.temas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tema{background:var(--div);border-radius:999px;padding:4px 10px;font-size:14px}
.barras{display:grid;gap:8px;margin-top:8px}
.barra-c{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:10px;align-items:center;font-size:14px}
.pista{height:10px;border-radius:999px;background:var(--div);overflow:hidden}
.pista i{display:block;height:100%;background:var(--marca);border-radius:999px}
.linea{position:relative;margin-top:6px}
.hito{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding-block:12px;border-top:1px solid var(--div)}
.hito:first-child{border-top:0}
.hito .fe{color:var(--suave);font-size:14px}
.hito .ti{font-weight:700}
.tipo{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;margin-right:6px}

/* Cómo funciona */
.quien{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.quien .caja p{margin:6px 0 0;color:var(--suave);font-size:15px}

/* Botón registrar flotante */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--marca);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:800;font-size:17px;box-shadow:0 6px 20px rgba(60,20,50,.28);min-height:52px;z-index:20}
:root[data-theme="dark"] .fab{color:#201823}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#201823}}

/* Hoja */
.velo{position:fixed;inset:0;background:rgba(20,10,18,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.velo{align-items:center}}
.hoja{background:var(--sup);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.hoja{border-radius:20px}}
.hoja h2{font-size:22px;font-weight:800;margin-bottom:4px}
.hoja .sub{color:var(--suave);margin:0 0 14px}
.opc{display:grid;gap:8px}
.opc button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--borde);background:var(--sup);border-radius:14px;padding:14px;min-height:60px}
.opc button b{display:block;font-size:17px}
.opc button span{color:var(--suave);font-size:14px}
.campo{display:grid;gap:6px;margin-bottom:12px}
.campo label{font-weight:700;font-size:15px}
.campo select,.campo input,.campo textarea{border:1px solid var(--borde);background:var(--fondo);border-radius:12px;padding:12px;min-height:48px;width:100%}
.contador{display:flex;align-items:center;gap:10px}
.contador button{width:48px;height:48px;border-radius:12px;border:1px solid var(--borde);background:var(--fondo);font-size:22px;font-weight:700}
.contador output{min-width:48px;text-align:center;font-size:22px;font-weight:800}
.dos-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.dos-col{grid-template-columns:1fr}}
.acciones{display:flex;gap:10px;margin-top:8px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;min-height:52px;flex:1}
.btn.pri{background:var(--marca);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#201823}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#201823}}
.btn.sec{background:var(--div);color:var(--texto)}
.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--texto);color:var(--fondo);padding:12px 18px;border-radius:12px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
/* Guía: dibujos simplificados de Tino */
.guia{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:800px){.guia{grid-template-columns:1fr}}
.pant{border:2px solid var(--borde);border-radius:18px;background:var(--fondo);display:grid;grid-template-columns:70px minmax(0,1fr);overflow:hidden;min-width:0}
.riel{background:var(--sup);border-right:1px solid var(--borde);display:flex;flex-direction:column;gap:6px;padding:10px 6px;align-items:stretch}
.riel span{font-size:12px;text-align:center;padding:7px 2px;border-radius:9px;color:var(--suave);font-weight:600;position:relative}
.riel span.on{background:var(--marca-suave);color:var(--marca)}
.riel span.mas{background:var(--marca);color:#fff}
.cont{padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.cont .tit{font-weight:800;font-size:16px}
.blk{background:var(--sup);border:1px solid var(--borde);border-radius:10px;padding:8px 10px;font-size:13px;position:relative;min-width:0}
.blk.lado{display:flex;gap:8px;flex-wrap:wrap}
.blk .mini{background:var(--div);border-radius:999px;padding:2px 8px;font-size:12px}
.blk .bt{background:var(--marca);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.marca-hl{box-shadow:0 0 0 3px var(--apo)}
.pin{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--apo);color:#fff;font-size:12px;font-weight:800;padding:0 4px;vertical-align:middle}
.riel .pin{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;font-size:11px}
.blk > .pin{position:absolute;top:-9px;right:-7px}
.pasos{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.pasos li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.pasos li b{display:block}
.pasos li span.d{color:var(--suave);font-size:15px}
.pronto{background:var(--info-f);color:var(--info);border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px;margin-left:6px}
.mapa-t td{white-space:normal;vertical-align:top}
.mapa-t td:first-child{font-weight:600;width:34%}
.ruta{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.ruta span{background:var(--marca-suave);color:var(--marca);border-radius:8px;padding:2px 8px;font-weight:600;font-size:14px}
.ruta i{font-style:normal;color:var(--suave)}
@media (prefers-reduced-motion:no-preference){.hoja{animation:sube .18s ease-out}@keyframes sube{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="envoltura">
  <header class="cabeza">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#74305F"/><path d="M50 48 V78" stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M37 27 L46 36 L64 15" stroke="#E9C6DC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <div>
      <h1>Formación y desempeño</h1>
      <p>El ciclo de las asesoras de los varios puntos: planear, hacer y seguir</p>
    </div>
  </header>

  <div class="ejemplo" role="note"><span aria-hidden="true">ⓘ</span><div><b>Esto es un ejemplo.</b> Los nombres y los números son inventados, para que veas cómo se vería. Cuando tu equipo empiece a anotar, aquí salen los datos reales.</div></div>

  <nav class="pestanas" role="tablist" aria-label="Vistas">
    <button role="tab" id="t-equipo" data-vista="equipo" aria-selected="true">Todo el equipo</button>
    <button role="tab" id="t-punto" data-vista="punto" aria-selected="false">Por punto</button>
    <button role="tab" id="t-asesora" data-vista="asesora" aria-selected="false">Por asesora</button>
    <button role="tab" id="t-como" data-vista="como" aria-selected="false">Cómo se usa</button>
    <button role="tab" id="t-guia" data-vista="guia" aria-selected="false">Dónde está en Tino</button>
  </nav>

  <div class="barra" id="barra-periodo">
    <div class="periodo"><label for="sel-periodo">Ver:</label>
      <select id="sel-periodo">
        <option value="mes">Este mes (noviembre)</option>
        <option value="semana">Esta semana</option>
      </select>
      <span id="compara">comparado con octubre</span>
    </div>
  </div>

  <main id="vista"></main>
</div>

<button class="fab" id="fab" aria-haspopup="dialog">+ Anotar</button>
<div id="capa"></div>

<script>
(function(){
const HOY = new Date(2026,10,21);
const PUNTOS = ["Punto Centro","Punto Norte","Punto Sur","Punto Plaza","Punto Estación","Punto Parque","Punto Avenida","Punto Occidente","Punto Oriente","Punto Terminal","Punto Calle 80"];
const ETAPAS = [
  {k:"diag",t:"Diagnóstico",q:"Ver cómo atiende hoy"},
  {k:"form",t:"Formación",q:"Venta consultiva y Club de puntos"},
  {k:"acomp",t:"Acompañamiento",q:"Coaching en el punto"},
  {k:"eval",t:"Evaluación",q:"Cliente incógnito y estándares"},
  {k:"comp",t:"Compromisos",q:"Lo que acordó mejorar"}
];
// [nombre, punto, etapa, atendidos, conversion%, club%, puntos%, referidos, ticket, estandares%, puntualidad%, celular(llamados), presentacion%, factorAnterior]
const BASE = [
 ["Laura Gómez","Punto Centro","comp",412,62,71,88,18,96500,92,98,0,96,0.93],
 ["Paola Ruiz","Punto Centro","eval",365,55,58,79,11,88200,85,95,1,92,0.97],
 ["Diana Torres","Punto Norte","acomp",298,41,33,52,4,74100,68,86,4,80,1.04],
 ["Camila Rojas","Punto Sur","form",276,49,45,70,7,81300,79,92,2,88,0.95],
 ["Natalia Peña","Punto Plaza","eval",388,58,64,84,14,102300,88,100,0,94,0.92],
 ["Sandra Vargas","Punto Estación","acomp",254,37,29,47,3,69800,64,82,5,78,1.06],
 ["Yuliana Mora","Punto Parque","comp",331,53,60,81,9,90100,84,97,1,90,0.96],
 ["Marcela Ríos","Punto Avenida","diag",219,44,38,61,5,77400,72,90,3,85,1.0],
 ["Johana Díaz","Punto Occidente","form",305,51,52,74,8,84600,81,94,1,89,0.94],
 ["Lorena Castillo","Punto Oriente","eval",342,56,66,86,12,93700,87,96,0,93,0.95],
 ["Viviana Suárez","Punto Terminal","acomp",267,46,41,63,6,79900,76,88,2,86,0.98],
 ["Karen Molina","Punto Calle 80","diag",238,42,36,58,4,75200,70,91,3,84,1.02]
];
const iniciales = n => n.split(" ").map(p=>p[0]).slice(0,2).join("");
const pesos = v => "$ " + Math.round(v).toLocaleString("es-CO");
const ASES = BASE.map((b,i)=>({id:"a"+i,nombre:b[0],punto:b[1],etapa:b[2],
  act:{at:b[3],conv:b[4],club:b[5],pts:b[6],ref:b[7],tick:b[8],est:b[9],pun:b[10],cel:b[11],pre:b[12]},f:b[13]}));
// anterior: un poco distinto
ASES.forEach(a=>{const f=a.f,x=a.act;a.ant={at:Math.round(x.at*f*0.98),conv:Math.round(x.conv*f),club:Math.round(x.club*f*0.97),pts:Math.round(x.pts*f),ref:Math.max(0,Math.round(x.ref*f)-1),tick:Math.round(x.tick*(0.97+(1-f)/2)),est:Math.round(Math.min(100,x.est*f)),pun:Math.round(Math.min(100,x.pun*(f>1?1.02:0.98))),cel:Math.max(0,x.cel+(f>1?-1:1)),pre:Math.round(Math.min(100,x.pre*f))};});

const COMPROMISOS = [
 {a:"a5",q:"Explicar el Club de puntos a todo cliente que compre",resp:"Líder comercial",lim:new Date(2026,10,14),estado:"vencido",av:"La vimos explicarlo 3 de 10 veces"},
 {a:"a5",q:"No usar el celular frente al cliente",resp:"Responsable del punto",lim:new Date(2026,10,18),estado:"vencido",av:"2 llamados de atención esta semana"},

function escala(x){ return estado.periodo==="semana" ? 0.25 : 1; }

// Agrega indicadores de un grupo de asesoras
function suma(lista, cual){
  const k=escala();
  let at=0,ven=0,club=0,pts=0,ref=0,plata=0,est=0,pun=0,cel=0,pre=0;
  lista.forEach(a=>{const x=a[cual];const at1=x.at*k;const v=at1*x.conv/100;
    at+=at1;ven+=v;club+=at1*x.club/100;pts+=v*x.pts/100;ref+=x.ref*k;plata+=v*x.tick;est+=x.est;pun+=x.pun;cel+=x.cel*(k===1?1:0.5);pre+=x.pre;});
  const n=lista.length||1;
  return {at:Math.round(at),conv:ven/at*100,club:club/at*100,pts:pts/ven*100,ref:Math.round(ref),tick:plata/ven,est:est/n,pun:pun/n,cel:Math.round(cel),pre:pre/n};
}

const INDIC = [

 {k:"pts",n:"Consultó puntos antes de cobrar",fmt:v=>Math.round(v)+" %",exp:"de las ventas",mejor:"sube",dif:"pts"},
 {k:"ref",n:"Referidos",fmt:v=>v,exp:"clientes que llegaron recomendados",mejor:"sube",dif:"%"},
 {k:"conv",n:"Conversión",fmt:v=>Math.round(v)+" %",exp:"de los atendidos compraron",mejor:"sube",dif:"pts"},
 {k:"tick",n:"Ticket promedio",fmt:v=>pesos(v),exp:"lo que compra cada cliente",mejor:"sube",dif:"%"},
 {k:"est",n:"Cumplimiento de estándares",fmt:v=>Math.round(v)+" %",exp:"según las evaluaciones",mejor:"sube",dif:"pts"},
 {k:"pre",n:"Presentación personal",fmt:v=>Math.round(v)+" %",exp:"de las revisiones, bien",mejor:"sube",dif:"pts"},
 {k:"pun",n:"Puntualidad",fmt:v=>Math.round(v)+" %",exp:"de los días llegó a tiempo",mejor:"sube",dif:"pts"},
 {k:"cel",n:"Uso del celular",fmt:v=>v,exp:"llamados de atención",mejor:"baja",dif:"num"}
];
function delta(ind, a, b){
  let d, txt;
  if(ind.dif==="pts"){ d=a-b; txt=(d>0?"▲ ":d<0?"▼ ":"")+Math.abs(Math.round(d))+" puntos"; }
  else if(ind.dif==="%"){ d=b? (a-b)/b*100 : 0; txt=(d>0?"▲ ":d<0?"▼ ":"")+Math.abs(Math.round(d))+" %"; }
  else { d=a-b; txt=(d>0?"▲ ":d<0?"▼ ":"")+Math.abs(Math.round(d)); }
  if(Math.round(d)===0) return `<span class="delta igual">Igual que antes</span>`;
  const bueno = ind.mejor==="sube" ? d>0 : d<0;
  return `<span class="delta ${bueno?"sube":"baja"}">${txt}</span> <span class="exp">frente a ${estado.periodo==="mes"?"octubre":"la semana pasada"}</span>`;
}
function tarjetas(lista){
  const a=suma(lista,"act"), b=suma(lista,"ant");
  return `<div class="ind">${INDIC.map(i=>`<div class="kpi"><div class="n">${i.n}</div><div class="v num">${i.fmt(a[i.k])}</div><div class="exp">${i.exp}</div><div>${delta(i,a[i.k],b[i.k])}</div></div>`).join("")}</div>`;
}

// Quién necesita acompañamiento
function razones(a){
  const x=a.act, r=[];
  if(x.club<40) r.push("explica poco el Club de puntos");
  if(x.pts<55) r.push("no consulta los puntos antes de cobrar");
  if(x.conv<45) r.push("baja conversión");
  if(x.est<70) r.push("estándares bajos");
  if(x.cel>=3) r.push("uso del celular");
  const venc=COMPROMISOS.filter(c=>c.a===a.id&&c.estado==="vencido").length;
  if(venc>=2) r.push(venc+" compromisos vencidos");
  return r;
}
function semaforo(a){
  const n=razones(a).length;
  if(n>=3) return `<span class="est c-apo">■ Necesita apoyo</span>`;
  if(n>=1) return `<span class="est c-rev">▲ Revisar</span>`;
  return `<span class="est c-ok">● Va bien</span>`;
}

function riel(on, pins){
  const items=[["mas","+ Registrar"],["hoy","Hoy"],["equipo","Equipo"],["ventas","Ventas"],["caja","Caja"],["masm","Más"]];
  return `<div class="riel">${items.map(([k,t])=>`<span class="${k==="mas"?"mas":k===on?"on":""}">${t}${pins&&pins[k]?pin(pins[k]):""}</span>`).join("")}</div>`;
}
function pasos(lista){return `<ol class="pasos">${lista.map((p,i)=>`<li>${pin(i+1)}<div><b>${p[0]}</b><span class="d">${p[1]}</span></div></li>`).join("")}</ol>`;}
function vistaGuia(){

  <section class="seccion"><h2>Lo que pediste y dónde está</h2>

      <tr><td>Diagnóstico inicial</td><td>${R("+ Registrar","Diagnóstico u objetivo")}</td></tr>

  <section class="seccion"><h2>Para dejarlo listo, en este orden</h2>
    <div class="caja">${pasos([["Pon las reglas","Equipo › Ajustes: temas, criterios y quién necesita apoyo."],["Pon las metas","Por punto o por asesora."],["Revisa tus asesoras","Que estén todas y en sus puntos."],["Empieza a anotar","Cada quien su parte, con el botón + Registrar."],["Cada semana, mira Hoy","Compromisos vencidos y quién necesita apoyo."]])}</div>
  </section>`;
}

function pintar(){
  document.querySelectorAll(".pestanas button").forEach(b=>b.setAttribute("aria-selected",b.dataset.vista===estado.vista));
  document.getElementById("barra-periodo").hidden = estado.vista==="como"||estado.vista==="guia";
  document.getElementById("compara").textContent = estado.periodo==="mes"?"comparado con octubre":"comparada con la semana pasada";
  const v=document.getElementById("vista");
  v.innerHTML = estado.vista==="equipo"?vistaEquipo():estado.vista==="punto"?vistaPunto():estado.vista==="asesora"?vistaAsesora():estado.vista==="guia"?vistaGuia():vistaComo();
}

document.querySelector(".pestanas").addEventListener("click",e=>{const b=e.target.closest("button[data-vista]");if(!b)return;estado.vista=b.dataset.vista;pintar();window.scrollTo({top:0});});
document.getElementById("sel-periodo").addEventListener("change",e=>{estado.periodo=e.target.value;pintar();});
document.getElementById("vista").addEventListener("click",e=>{
  const ir=e.target.closest("[data-ir]"); if(ir){estado.asesora=ir.dataset.ir;estado.vista="asesora";pintar();window.scrollTo({top:0});return;}
  const p=e.target.closest("[data-punto]"); if(p){estado.punto=p.dataset.punto;pintar();return;}
  const s=e.target.closest("[data-asesora]"); if(s){estado.asesora=s.dataset.asesora;pintar();return;}
});
document.getElementById("vista").addEventListener("keydown",e=>{if(e.key==="Enter"){const t=e.target.closest("tr[data-ir]");if(t){estado.asesora=t.dataset.ir;estado.vista="asesora";pintar();}}});

// Hoja para anotar
const capa=document.getElementById("capa");
function cerrar(){capa.innerHTML="";document.getElementById("fab").focus();}
function hoja(html){capa.innerHTML=`<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-t">${html}</div></div>`;
  document.getElementById("velo").addEventListener("click",e=>{if(e.target.id==="velo")cerrar();});
  const f=capa.querySelector("button,select,input");f&&f.focus();}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&capa.innerHTML)cerrar();});
const opAses=()=>ASES.map(a=>`<option value="${a.id}">${esc(a.nombre)} · ${esc(a.punto)}</option>`).join("");
function contador(id,label){return `<div class="campo"><label id="l-${id}">${label}</label><div class="contador" role="group" aria-labelledby="l-${id}"><button type="button" data-menos="${id}" aria-label="Menos">−</button><output id="${id}">0</output><button type="button" data-mas="${id}" aria-label="Más">+</button></div></div>`;}
function aviso(t){const d=document.createElement("div");d.className="aviso";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
const FORMS={
 dia:{t:"Registro del día",s:"Lo llena la responsable del punto al cerrar. Por cada asesora.",
  c:()=>`<div class="campo"><label for="f-a">Asesora</label><select id="f-a">${opAses()}</select></div>
   <div class="dos-col">${contador("c1","Clientes atendidos")}${contador("c2","Les explicó el Club de puntos")}${contador("c3","Consultó puntos antes de cobrar")}${contador("c4","Referidos")}</div>
   <div class="campo"><label for="f-n">Novedades del día (si hubo)</label><textarea id="f-n" rows="2" placeholder="Ej.: llegó tarde 15 minutos"></textarea></div>`},
 obs:{t:"Observación",s:"Lo que viste hoy de una asesora.",
  c:()=>`<div class="campo"><label for="f-a">Asesora</label><select id="f-a">${opAses()}</select></div>
   <div class="campo"><label for="f-t">Qué fue</label><select id="f-t"><option>Coaching</option><option>Cliente incógnito</option><option>Presentación personal</option><option>Uso del celular</option><option>Puntualidad</option><option>Novedad operativa</option></select></div>
   <div class="campo"><label for="f-c">¿Cómo le fue?</label><select id="f-c"><option>Bien</option><option>Puede mejorar</option><option>Mal</option></select></div>
   <div class="campo"><label for="f-n">Qué viste</label><textarea id="f-n" rows="3"></textarea></div>`},
 comp:{t:"Compromiso",s:"Qué va a mejorar, quién responde y para cuándo.",
  c:()=>`<div class="campo"><label for="f-a">Asesora</label><select id="f-a">${opAses()}</select></div>
   <div class="campo"><label for="f-q">Qué se compromete a hacer</label><input id="f-q" placeholder="Ej.: explicar el Club de puntos a todo cliente que compre"></div>
   <div class="dos-col"><div class="campo"><label for="f-r">Quién le hace seguimiento</label><select id="f-r"><option>Líder comercial</option><option>Formación</option><option>Responsable del punto</option></select></div>
   <div class="campo"><label for="f-l">Para cuándo</label><input id="f-l" type="date" value="2026-11-28"></div></div>`},
 ses:{t:"Capacitación",s:"Programa una capacitación o anota una que ya pasó.",
  c:()=>`<div class="campo"><label for="f-q">Tema</label><select id="f-q"><option>Venta consultiva</option><option>Club de puntos</option><option>Consulta de puntos</option><option>Estándares de atención</option></select></div>
   <div class="dos-col"><div class="campo"><label for="f-l">Fecha</label><input id="f-l" type="date" value="2026-11-30"></div><div class="campo"><label for="f-p">Dónde</label><select id="f-p">${PUNTOS.map(p=>`<option>${p}</option>`).join("")}<option>Virtual</option></select></div></div>
   <div class="campo"><label for="f-a">Quiénes asisten</label><select id="f-a" multiple size="5">${opAses()}</select></div>`},
 eva:{t:"Evaluación",s:"Califica de 1 a 5 cada criterio.",
  c:()=>`<div class="campo"><label for="f-a">Asesora</label><select id="f-a">${opAses()}</select></div>
   ${CRITERIOS.map((c,i)=>`<div class="campo"><label for="f-e${i}">${c}</label><select id="f-e${i}"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>`).join("")}`}
};
function menu(){hoja(`<h2 id="hoja-t">¿Qué quieres anotar?</h2><p class="sub">Elige una opción.</p><div class="opc">
 <button data-f="dia"><span class="av">1</span><span><b>Registro del día</b><span>Clientes, Club de puntos, puntos y referidos</span></span></button>
 <button data-f="obs"><span class="av">2</span><span><b>Observación</b><span>Coaching, cliente incógnito, celular, puntualidad…</span></span></button>
 <button data-f="comp"><span class="av">3</span><span><b>Compromiso</b><span>Qué va a mejorar y para cuándo</span></span></button>
 <button data-f="ses"><span class="av">4</span><span><b>Capacitación</b><span>Fecha, tema y quiénes asisten</span></span></button>
 <button data-f="eva"><span class="av">5</span><span><b>Evaluación</b><span>De 1 a 5 por criterio</span></span></button>
 </div><div class="acciones"><button class="btn sec" data-cerrar>Cerrar</button></div>`);}
function formulario(k){const f=FORMS[k];hoja(`<h2 id="hoja-t">${f.t}</h2><p class="sub">${f.s}</p><form id="frm">${f.c()}<div class="acciones"><button type="button" class="btn sec" data-volver>Atrás</button><button class="btn pri">Guardar</button></div></form>`);
  capa.querySelector("#frm").addEventListener("submit",e=>{e.preventDefault();cerrar();aviso("Listo. En el ejemplo no se guarda; en Tino quedaría anotado.");});}
capa.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]"); if(f){formulario(f.dataset.f);return;}
  if(e.target.closest("[data-cerrar]")){cerrar();return;}
  if(e.target.closest("[data-volver]")){menu();return;}
  const m=e.target.closest("[data-mas]"); if(m){const o=document.getElementById(m.dataset.mas);o.value=o.textContent=+o.textContent+1;return;}
  const n=e.target.closest("[data-menos]"); if(n){const o=document.getElementById(n.dataset.menos);o.textContent=Math.max(0,+o.textContent-1);return;}
});
document.getElementById("fab").addEventListener("click",menu);

pintar();
})();
</script>
