<html lang="es">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tino · Pantallas de referencia</title>

<style>
:root{
  --marca:#74305F; --marca-hover:#5A2449; --marca-suave:#F3E4EE; --foco:#C99BBB;
  --fondo:#F7F5F7; --sup:#FFFFFF; --texto:#22161F; --suave:#5E5862; --borde:#E2DDE3; --divisor:#F0ECF0;
  --ok:#1C7638; --ok-bg:#E1F2E5; --rev:#7A5A00; --rev-bg:#FBF1CC; --rev-borde:#F0E2A8;
  --mal:#9A2A0A; --mal-bg:#FDE5DA; --mal-borde:#F6CBB8; --info:#2557A7; --info-bg:#E3ECFA;
  --neutro:#4F4853; --peligro:#C2410C;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--texto);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1232px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:24px;font-weight:800}
h2{font-size:18px;font-weight:700}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo-svg{width:40px;height:40px;flex:none;display:block}
.sub{font-size:13px;color:var(--suave)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--ok-bg)} .p-rev{color:var(--rev);background:var(--rev-bg)}
.p-mal{color:var(--mal);background:var(--mal-bg)} .p-info{color:var(--info);background:var(--info-bg)}
.p-neu{color:var(--neutro);background:var(--divisor)}

nav.menu{display:flex;gap:4px;overflow-x:auto;background:var(--sup);border:1px solid var(--borde);border-radius:12px;padding:6px;scrollbar-width:none;position:sticky;top:0;z-index:5}
nav.menu button{flex:none;border:0;background:transparent;padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--suave);min-height:44px}
nav.menu button[aria-current="page"]{background:var(--marca-suave);color:var(--marca);font-weight:700}

.card{background:var(--sup);border:1px solid var(--borde);border-radius:12px;padding:20px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{background:var(--sup);border:1px solid var(--borde);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tile .lbl{font-size:13px;color:var(--suave);font-weight:600}
.tile .big{font-size:28px;font-weight:800;letter-spacing:-.01em}
.tile.alert{background:var(--mal-bg);border-color:var(--mal-borde)} .tile.alert *{color:var(--mal)}
.tile.focus{border:2px solid var(--marca)} .tile.focus .lbl{color:var(--marca)}

.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.main{flex:999 1 600px;min-width:0}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}

.btn{height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--marca);color:#fff;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--marca-hover)}
.btn.sec{background:var(--sup);color:var(--marca);border:1px solid var(--marca)} .btn.sec:hover{background:var(--marca-suave)}
.btn.txt{background:transparent;color:var(--marca);padding:0 12px} .btn.txt:hover{background:var(--marca-suave)}
.btn.danger{background:var(--peligro)} .btn.danger:hover{background:#A3360A}
.btn.small{height:40px;font-size:14px;padding:0 14px}
.btn.plain{background:var(--sup);color:var(--texto);border:1px solid var(--borde);font-weight:600}
.btn.plain:hover{background:var(--fondo)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipbtn{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--borde);background:var(--sup);font-size:14px;font-weight:600}
.chipbtn[aria-pressed="true"]{background:var(--texto);color:#fff;border-color:var(--texto)}
.spacer{flex:1}

.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--borde);text-align:left;white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--divisor)}
.r{text-align:right}
tr.total td{font-weight:800;border-bottom:0;padding-top:13px}
tr.click{cursor:pointer} tr.click:hover{background:var(--fondo)} tr.sel{background:var(--marca-suave)!important}

.item{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--sup);border:1px solid var(--borde);border-radius:12px;padding:14px 16px}
.item.sel{border:2px solid var(--marca);padding:13px 15px}
.item .head{display:flex;justify-content:space-between;gap:8px;width:100%}
.neg{color:var(--mal);font-weight:800}

.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cmp div{background:var(--fondo);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cmp div.bad{background:var(--mal-bg)} .cmp div.bad *{color:var(--mal)}
.cmp span{font-size:12.5px;color:var(--suave)} .cmp b{font-size:18px}
.bar{height:8px;background:var(--divisor);border-radius:4px;overflow:hidden} .bar i{display:block;height:100%;background:var(--marca);border-radius:4px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--divisor);border-radius:10px}
.ev svg{flex:none;margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--divisor);padding-top:16px}
.note{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.45}

.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:12px}
.tl .dot{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.tl .line{flex:1;width:2px;background:var(--divisor);min-height:16px;margin:0 auto}
.tl .col{display:flex;flex-direction:column;align-items:center;width:24px}
.tl .txt{display:flex;flex-direction:column;gap:2px;padding-bottom:14px}

.pend{display:flex;flex-wrap:wrap;align-items:center;gap:16px;border:1px solid var(--divisor);border-radius:10px;padding:14px 16px}
.pend .c{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px}
.cap{font-size:12px;color:var(--suave);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

.drop{border:2px dashed var(--foco);border-radius:12px;background:var(--sup);padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.drop.over{background:var(--marca-suave)}

/* phone */
.phones{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.phone{width:min(360px,100%);height:740px;border-radius:40px;border:10px solid #22161F;background:var(--fondo);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(34,22,31,.18)}
.ph-top{padding:26px 18px 12px;background:var(--sup);border-bottom:1px solid var(--borde);display:flex;flex-direction:column;gap:4px}
.ph-body{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.ph-foot{padding:12px 18px 20px;background:var(--sup);border-top:1px solid var(--borde)}
.ph-foot .btn{width:100%;height:52px;font-size:17px;border-radius:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:14px;font-weight:600}
.field input{height:50px;border-radius:12px;border:1px solid var(--borde);background:var(--sup);padding:0 14px;font-size:17px;min-width:0;width:100%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{height:48px;border-radius:12px;border:1px solid var(--borde);background:var(--sup);font-size:15px;font-weight:600}
.seg button[aria-pressed="true"]{border:2px solid var(--marca);background:var(--marca-suave);color:var(--marca);font-weight:700}
.list{background:var(--sup);border:1px solid var(--borde);border-radius:14px;overflow:hidden}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--divisor);min-height:44px}
.list .li:last-child{border-bottom:0}
.list .li.bad{background:var(--mal-bg)} .list .li.bad b,.list .li.bad span{color:var(--mal)}

.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--texto);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:13px;color:var(--suave)}
@media (max-width:560px){ h1{font-size:21px} .tile .big{font-size:24px} .cmp{grid-template-columns:1fr} .card{padding:16px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo-svg" width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#74305F"/><path d="M50 48 V78" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/><path d="M37 27 L46 36 L64 15" fill="none" stroke="#E9C6DC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1 id="title">Control diario</h1><div class="sub" id="subtitle">Sábado 31 de octubre · 11 puntos</div></div>

<script>
(function(){
const $ = (s) => document.querySelector(s);
const f = (n) => Math.round(n).toLocaleString('es-CO');
const ICON = {

/* ---------- datos de ejemplo ---------- */
const PUNTOS = [

  ['Punto 4',295000,760000,455000,'bad'],['Punto 5',512000,1340000,720000,'ok'],['Punto 6',268000,690000,310000,'ok'],
  ['Punto 7',445000,1015000,580000,'ok'],['Punto 8',330000,870000,402000,'ok'],['Punto 9',360000,805000,495000,'bad'],

];
const DESC = [
  { id:'p4', punto:'Punto 4', medio:'Transferencia', hora:'Hoy 14:32', dif:85000, estado:'abierto', causa:'La transferencia no llegó al banco',
    a:['Reportado por la asesora',455000], b:['Llegó a Bancolombia',370000], conf:90, confTxt:'Alta · 90%',

  { id:'ken', punto:'Punto 1', medio:'Tarjeta', hora:'Hoy 18:05', dif:2870, estado:'abierto', causa:'La comisión de Bold no se descontó',
    a:['Reportado en tarjeta',1480000], b:['Abonado por Bold',1477130], conf:65, confTxt:'Media · 65%',

    a:['Reportado en tarjeta',735000], b:['Abonado por Redeban',690000], conf:95, confTxt:'Alta · 95% · explicado por la encargada',

/* ---------- utilidades ---------- */
let tt;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2400); }
function copyTSV(rows){
  const txt = rows.map(r=>r.join('\t')).join('\n');
  const done = () => toast('Copiado. Péguelo en Excel: quedan números que se pueden sumar.');
  const fallback = () => { const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){toast('No se pudo copiar en este navegador.');} ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
}

function vInicio(){

  return `<div style="display:flex;flex-direction:column;gap:20px">

function vTransferencias(){
  const data = TRANS.map((t,i)=>({h:t[0],p:t[1],v:t[2],ref:t[3],e:S.tDone[i]||t[4],i}));
  const list = data.filter(d=>S.tTab==='todas'||d.e===S.tTab);
  const sel = data[list.some(d=>d.i===S.tSel)?S.tSel:(list[0]?list[0].i:0)];
  const est = { ok:'<span class="pill p-ok">● Verificada</span>', wait:'<span class="pill p-info">Esperando banco</span>', bad:'<span class="pill p-mal">■ Sospechosa</span>', conf:'<span class="pill p-ok">● Confirmada a mano</span>', rej:'<span class="pill p-neu">Rechazada</span>' };
  const banco = { ok:'Aviso recibido', wait:'Esperando', bad:'Sin aviso', conf:'Confirmada con nota', rej:'—' };
  const st = (ic,bg,fg,t,d)=>`<div class="st"><div class="col"><span class="dot" style="background:${bg};color:${fg}">${ic}</span><span class="line"></span></div><div class="txt"><b style="font-size:14px">${t}</b><span class="sub">${d}</span></div></div>`;
  const g = ['✓','#E1F2E5','#1C7638'];
  let steps = st(...g,'Comprobante recibido',sel.h+' · desde la app de la asesora');
  if (sel.e==='ok') steps += st(...g,'Aviso de Bancolombia','Llegó en menos de 2 minutos · mismo valor y cuenta');
  else if (sel.e==='wait') steps += st('…','#E3ECFA','#2557A7','Esperando aviso de Bancolombia','Faltan 24 minutos para marcarla como sospechosa');
  else if (sel.e==='bad') steps += st('!','#FDE5DA','#9A2A0A','Sin aviso de Bancolombia','Pasaron más de 30 minutos sin un aviso por ese valor');
  else if (sel.e==='conf') steps += st(...g,'Confirmada a mano','Con nota de quien la revisó');
  else steps += st('×','#F0ECF0','#4F4853','Rechazada','Pasa a descuadres del punto');
  steps += st('·','#F0ECF0','#5E5862','Extracto','Mañana confirma o descarta definitivamente');
  return `<div style="display:flex;flex-direction:column;gap:16px">
  ${chips([['todas','Todas · 48'],['ok','Verificadas'],['wait','Esperando'],['bad','Sospechosas']], S.tTab, 'tTab')}
  <div class="row">
    <section class="card main" style="padding:14px 18px"><div class="tablebox"><table class="num" style="min-width:520px">
      <thead><tr><th>Hora</th><th>Punto</th><th class="r">Valor</th><th>Banco</th><th>Estado</th></tr></thead>
      <tbody>${list.map(d=>`<tr class="click ${d.i===sel.i?'sel':''}" data-a="tSel" data-v="${d.i}" tabindex="0"><td>${d.h}</td><td><b>${d.p}</b></td><td class="r"><b>${f(d.v)}</b></td><td class="sub">${banco[d.e]}</td><td>${est[d.e]}</td></tr>`).join('') || '<tr><td colspan="5" class="sub">Nada en esta lista.</td></tr>'}</tbody>
    </table></div><p class="sub" style="margin:10px 0 0">Toque una fila para ver su recorrido.</p></section>
    <aside class="card side" style="gap:14px">
      <div><div class="sub" style="font-weight:600">${sel.p} · ${sel.h} · ref. ${sel.ref}</div><div class="num" style="font-size:28px;font-weight:800">$ ${f(sel.v)}</div></div>
      <div class="tl">${steps}</div>
      ${sel.e==='bad'?`<div class="note p-mal">El banco no avisó de esta transferencia en 30 minutos. No se aprueba hasta que llegue el aviso o el extracto.</div>
      <button class="btn" data-a="toast" data-v="Se le pidió el comprobante de nuevo a la asesora.">Pedir el comprobante de nuevo</button>
      <button class="btn sec" data-a="tConf" data-v="${sel.i}">Confirmar a mano con una nota</button>
      <button class="btn danger" data-a="tRej" data-v="${sel.i}">Rechazar transferencia</button>`:''}
    </aside>
  </div></div>`;
}

function comRows(){
  const share = {ambos:1,bold:.68,redeban:.32}[S.prov]; const T=[0,0,0,0,0,0];
  const rows = COM_BASE.map(([n,v])=>{ const b=v*share,c=b*.0299,rf=b*.015,ri=b*.0285,rc=b*.00414,ne=b-c-rf-ri-rc; [b,c,rf,ri,rc,ne].forEach((x,i)=>T[i]+=x); return [n,b,c,rf,ri,rc,ne]; });
  return {rows,T};
}

  const drop = $('#drop');
  if (drop){
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
    $('#fileIn').addEventListener('change',e=>addFiles(e.target.files));
  }
}
function guess(name){ const n=name.toLowerCase(); if(n.includes('bold'))return'Bold'; if(n.includes('redeban'))return'Redeban'; if(n.includes('banco')||n.includes('movim'))return'Extracto Bancolombia'; if(n.includes('siigo'))return'Siigo'; return'Excel diario'; }
function addFiles(list){ if(!list||!list.length)return; [...list].forEach(fl=>S.files.unshift([fl.name,'Ahora · demo, no se lee el contenido',guess(fl.name),'—','ok'])); render(); toast('Archivos recibidos. En la demo solo se muestran en la lista.'); }

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  switch(a){
    case 'go': S.view=v; render(); window.scrollTo({top:0}); return;
    case 'openDesc': S.view='descuadres'; S.dTab='abiertos'; S.dSel=v; render(); window.scrollTo({top:0}); return;
    case 'dTab': S.dTab=v; break;
    case 'dSel': S.dSel=v; break;
    case 'explain': S.dDone[v]=1; toast('Marcado como explicado. Queda en el historial.'); break;
    case 'tTab': S.tTab=v; break;
    case 'tSel': S.tSel=+v; break;
    case 'tConf': S.tDone[v]='conf'; toast('Confirmada a mano. Queda registrado quién la confirmó.'); break;
    case 'tRej': S.tDone[v]='rej'; toast('Transferencia rechazada. Pasa a descuadres del punto.'); break;
    case 'cTab': S.cTab=v; break;
    case 'cOk': S.cDone[v]=1; toast('Confirmado.'); break;
    case 'cNo': S.cDone[v]=1; toast('Descartado. Queda sin pareja para revisar.'); break;
    case 'prov': S.prov=v; break;
    case 'copyPuntos': copyTSV([['Punto','Efectivo','Tarjeta','Transferencia','Total']].concat(PUNTOS.map(p=>[p[0],p[1],p[2],p[3],p[1]+p[2]+p[3]]))); return;
    case 'copyCom': { const {rows}=comRows(); copyTSV([['Punto','Vendido','Comision','Retefuente','ReteIVA','ReteICA','Neto']].concat(rows.map(r=>[r[0]].concat(r.slice(1).map(x=>Math.round(x)))))); return; }
    case 'name': S.names[v]=1; toast('Listo. La próxima vez se reconoce sola.'); break;
    case 'undo': S.files[+v][4]='undo'; toast('Archivo deshecho. Sus datos se quitaron del sistema.'); break;
    case 'appGo': S.app.screen=v; break;
    case 'metodo': S.app.metodo=v; break;
    case 'saveFact': { const c=Math.max(parse(S.app.total)-parse(S.app.desc),0); if(!c){toast('Escribe el total de la factura.');return;} S.app.count++; S.app.sum+=c; const k={efectivo:'ef',tarjeta:'ta',transferencia:'tr',dividido:'ef'}[S.app.metodo]; S.app[k]+=c; S.app.fact='FE-'+(18342+S.app.count-23); S.app.total=''; S.app.desc=''; S.app.screen='cierre'; toast('Factura guardada en el celular.'); break; }
    case 'toast': toast(v); return;
    default: return;
  }
  render();
});
document.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ const el=e.target.closest('tr[data-a]'); if(el) el.click(); } });
document.addEventListener('input',(e)=>{
  const k=e.target.dataset.in; if(!k) return;
  S.app[k]=e.target.value;
  if(k==='total'||k==='desc'){ const c=$('#cobr'); if(c) c.textContent='$ '+f(Math.max(parse(S.app.total)-parse(S.app.desc),0)); }
});
render();
})();
</script>
</body>
